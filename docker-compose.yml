services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz_builder
    ports:
      - "5432:5432"
    volumes:
      - quiz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiz_pg:
